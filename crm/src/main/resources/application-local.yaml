spring:
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    url: ${DB_URL:jdbc:postgresql://localhost:5433/crm}

logging:
  level:
    com.epam.jym.crm: DEBUG

management:
  endpoint:
    health:
      show-details: always
      show-components: always
      group:
        crm:
          show-details: always
          show-components: always
