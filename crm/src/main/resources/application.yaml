server:
  port: ${SERVER_PORT:8020}

spring:
  application:
    name: crm
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true

security:
  password:
    length: ${SECURITY_PASSWORD_LENGTH:10}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [transactionId=%X{transactionId:-}] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    description: CRM service for trainers and trainees
