server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:VGhpcy1pcy1hLWxvY2FsLWRldi1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:8761/eureka/}
