name: jym
services:
  postgres:
    image: postgres:17
    container_name: crm-postgres
    networks:
      - jym-network
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8
    container_name: trainer-workload-redis
    networks:
      - jym-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:8
    container_name: trainer-workload-mongodb
    networks:
      - jym-network
    ports:
      - "27017:27017"
    volumes:
      - trainer-workload-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  activemq:
    image: apache/activemq-classic:6.1.3
    container_name: jym-activemq
    networks:
      - jym-network
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD", "/opt/apache-activemq/bin/activemq", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  crm:
    image: jym-crm:${APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: crm
        APP_PORT: 8020
    container_name: crm-app
    networks:
      - jym-network
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_URL: jdbc:postgresql://postgres:5432/crm
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8020/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  eureka:
    image: jym-eureka:${APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eureka
        APP_PORT: 8761
    container_name: eureka-app
    networks:
      - jym-network
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    image: jym-gateway:${APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway
        APP_PORT: 8080
    container_name: gateway-app
    networks:
      - jym-network
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  trainer-workload:
    image: jym-trainer-workload:${APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: trainer-workload
        APP_PORT: 8030
    container_name: trainer-workload-app
    networks:
      - jym-network
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongodb:27017/trainer-workload
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    ports:
      - "8030:8030"
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8030/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  crm-postgres-data:
  trainer-workload-mongodb-data:

networks:
  jym-network:
