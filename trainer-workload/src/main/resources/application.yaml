server:
  port: ${SERVER_PORT:8030}

spring:
  application:
    name: trainer-workload
  profiles:
    default: local
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/trainer-workload}

messaging:
  trainer-workload:
    queue: ${TRAINER_WORKLOAD_SINGLE_QUEUE:trainer-workload.update}
    dlq: ${TRAINER_WORKLOAD_DLQ:trainer-workload.update.dlq}
    max-delivery-attempts: ${TRAINER_WORKLOAD_MAX_DELIVERY_ATTEMPTS:3}

messaging:
  trainer-workload:
    queue: ${TRAINER_WORKLOAD_SINGLE_QUEUE:trainer-workload.update}
    dlq: ${TRAINER_WORKLOAD_DLQ:trainer-workload.update.dlq}
    max-delivery-attempts: ${TRAINER_WORKLOAD_MAX_DELIVERY_ATTEMPTS:3}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"

management:
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:8761/eureka/}
